<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F4F4F0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Vedam Reader | Bauhaus Edition</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <!-- Geometric Font for Bauhaus Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS Modules -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/card.css">
    <link rel="stylesheet" href="css/reader.css">
    <link rel="stylesheet" href="css/reading-bg.css">
    <link rel="stylesheet" href="css/filter.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/meanings.css">

</head>

<body class="light-theme">

    <!-- THE CANVAS: Giant background geometry -->
    <div class="bauhaus-canvas" aria-hidden="true">
        <div class="giant-shape bg-circle"></div>
        <div class="giant-shape bg-rectangle"></div>
        <div class="structural-line-vertical"></div>
    </div>

    <header class="site-header">
        <div class="header-content">
            <h1 class="logo">VEDAM<span class="dot">.</span></h1>
            <button id="theme-toggle" class="brutalist-toggle" aria-label="Toggle Dark/Light Mode">
                <span class="toggle-text">LIGHT</span>
                <div class="toggle-track">
                    <div class="toggle-block"></div>
                </div>
                <span class="toggle-text">DARK</span>
            </button>
        </div>
    </header>

    <!-- Sideways title element characteristic of Bauhaus -->
    <div class="side-title">ANCIENT TEXTS / MODERN GRID</div>

    <nav class="filter-bar" id="filter-bar">
        <div class="filter-header-row">
            <div class="filter-label">FILTER //</div>
            
            <div class="search-container" id="search-container">
                <button class="search-icon-btn" id="search-btn" aria-label="Open Search">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="square" stroke-linejoin="miter">
                        <circle cx="10" cy="10" r="7"></circle>
                        <line x1="21" y1="21" x2="15" y2="15"></line>
                    </svg>
                </button>
                <input type="text" id="search-input" class="bauhaus-search" placeholder=" " autocomplete="off">
            </div>
        </div>

        <div class="filter-group" id="primary-filters">
            <button class="filter-btn active" data-category="ALL">ALL</button>
            <button class="filter-btn" data-category="DAYS">DAYS</button>
            <button class="filter-btn" data-category="GODS">GODS</button>
            <button class="filter-btn" data-category="SUKTAM">SUKTAM</button>
            <button class="filter-btn" data-category="STOTRAM">STOTRAM</button>
            <button class="filter-btn" data-category="PATH">PATH</button>
            <button class="filter-btn" data-category="PRARTHANA">PRARTHANA</button>
            <button class="filter-btn" data-category="UPANISHAD">UPANISHAD</button>
        </div>
        <div class="filter-group hidden" id="sub-filters">
            <!-- Buttons injected here by JS -->
        </div>
    </nav>
    
    <main class="content-grid" id="text-grid">
        <!-- PDF Cards will be injected here by JS -->
    </main>

    <div id="text-modal" class="modal hidden">
        
        <!-- MODULAR BACKGROUND: Controlled by CSS classes -->
        <div id="reader-bg" class="reading-bg bauhaus-bg-1" aria-hidden="true"></div>

        <!-- HUD: Close Button & Controls -->
        <button id="close-reader" class="bauhaus-close" aria-label="Close Reader">✕</button>
        
        <div class="bauhaus-toolbar">
            <button id="font-decrease" class="tool-btn bg-black" aria-label="Decrease Font">−</button>
            <div id="font-indicator" class="tool-info">100%</div>
            <button id="font-increase" class="tool-btn bg-black" aria-label="Increase Font">+</button>
        </div>

        <!-- The Text Content -->
        <div class="text-scroll-container">
            <article class="text-column">
                <div id="paper-watermark" class="paper-watermark"></div>
                <h2 id="text-title" class="reading-title">TITLE</h2>
                <div class="title-divider"></div>

                <button id="lang-toggle" class="lang-switch-toggle hidden" aria-label="Toggle Hindi and English Meanings">
                    <div class="lang-track">
                        <span class="lang-text lang-hi">हिं</span>
                        <span class="lang-text lang-en">E</span>
                        <div class="lang-block"></div>
                    </div>
                </button>
                
                <div id="text-content" class="reading-content"></div>
            </article>
        </div>
    </div>

    <!-- JS Modules remain the same -->
    <script src="js/data.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/render.js" defer></script>
    <script src="js/text-engine.js" defer></script>
    <script src="js/autoscroll.js" defer></script>
    <script src="js/search.js" defer></script>
    <script src="js/protect.js" defer></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg.scope))
                    .catch(err => console.error('Service Worker Registration Failed!', err));
            });
        }
    </script>
</body>

</html>
