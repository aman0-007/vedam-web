<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedam Reader | Bauhaus Edition</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <!-- Geometric Font for Bauhaus Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- CSS Modules -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/card.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/pdf-ui.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

</head>

<body class="light-theme">

    <!-- THE CANVAS: Giant background geometry -->
    <div class="bauhaus-canvas" aria-hidden="true">
        <div class="giant-shape bg-circle"></div>
        <div class="giant-shape bg-rectangle"></div>
        <div class="structural-line-vertical"></div>
    </div>

    <header class="site-header">
        <div class="header-content">
            <h1 class="logo">VEDAM<span class="dot">.</span></h1>
            <button id="theme-toggle" class="brutalist-toggle" aria-label="Toggle Dark/Light Mode">
                <span class="toggle-text">LIGHT</span>
                <div class="toggle-track">
                    <div class="toggle-block"></div>
                </div>
                <span class="toggle-text">DARK</span>
            </button>
        </div>
    </header>

    <!-- Sideways title element characteristic of Bauhaus -->
    <div class="side-title">ANCIENT TEXTS / MODERN GRID</div>

    <main class="content-grid" id="pdf-grid">
        <!-- PDF Cards will be injected here by JS -->
    </main>

    <!-- Fullscreen PDF Viewer Modal remains the same -->
    <div id="pdf-modal" class="modal hidden">
        <div class="modal-body">

            <!-- ADVANCED BAUHAUS GEOMETRIC LOADER -->
            <div id="bauhaus-loader" class="bauhaus-loader fade-out">
                <div class="loader-shapes">
                    <div class="loader-circle"></div>
                    <div class="loader-square"></div>
                    <div class="loader-line"></div>
                </div>
                <p class="loader-text">LOADING<span class="loader-dots">...</span></p>
            </div>

            <!-- PDF Canvas Container -->
            <div id="pdf-render-container">
                <canvas id="pdf-canvas"></canvas>
            </div>

            <!-- NEW: True Bauhaus Floating HUD -->
            <div id="pdf-floating-ui" class="pdf-floating-ui hidden">
                <!-- Close Button (Fixed to Viewport Corner) -->
                <button id="close-modal" class="bauhaus-close" aria-label="Close Reader">✕</button>
                
                <!-- Unified Bauhaus Control Strip (Bottom Center) -->
                <div class="bauhaus-toolbar">
                    <button id="prev-page" class="tool-btn bg-yellow" aria-label="Previous Page">◀</button>
                    <button id="zoom-out" class="tool-btn bg-black" aria-label="Zoom Out">−</button>
                    
                    <div id="page-info" class="tool-info">1 / --</div>
                    
                    <button id="zoom-in" class="tool-btn bg-black" aria-label="Zoom In">+</button>
                    <button id="rotate-page" class="tool-btn bg-black" aria-label="Rotate Page">↻</button>
                    <button id="next-page" class="tool-btn bg-yellow" aria-label="Next Page">▶</button>
                </div>
            </div>

        </div>
    </div>

    <!-- JS Modules remain the same -->
    <script src="js/data.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/render.js" defer></script>
    <script src="js/pdf-engine.js" defer></script>
    <script src="js/viewer-ui.js" defer></script>
</body>

</html>
